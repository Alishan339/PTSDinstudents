<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="Index.css">
    <title>Feedback Log</title>
</head>
<body>
    <h1 style="color: black; font-family: 'Times New Roman', Times, serif; text-align: center;">Feedback Log</h1>

    <nav style="background-color: grey; padding: 20px 0; margin: 50px 0;">
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; gap: 120px;">
            <li><a href="Home page.html" style="color: black; text-decoration: none; font-weight: bold; font-size: 20px;">Home</a></li>
            <li><a href="About Us Page.html" style="color: black; text-decoration: none; font-weight: bold; font-size: 20px;">About Us</a></li>
            <li><a href="Main Article Page.html" style="color: black; text-decoration: none; font-weight: bold; font-size: 20px;">Understanding PTSD</a></li>
            <li><a href="#" style="color: black; text-decoration: none; font-weight: bold; font-size: 20px;">Feedback Log</a></li>
        </ul>
    </nav>

    <div style="display: flex; justify-content: center; gap: 20px; margin: 20px;">
        <img src="Image7.png" alt="Support Image 1" style="width: 400px; height: 300px; object-fit: cover; border-radius: 10px;">
        <img src="Image6.png" alt="Support Image 2" style="width: 400px; height: 300px; object-fit: cover; border-radius: 10px;">
    </div>

    <div style="max-width: 1000px; margin: 40px auto; padding: 20px;">
        <div style="background-color: #f5f5f5; padding: 20px; border-radius: 10px;">
            <h2 style="text-align: center; color: #2c3e50;">Mood Tracking Calendar</h2>
            
            <div style="margin-bottom: 20px;">
                <h3 style="color: #2c3e50;">Text Highlighting Options</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button onclick="setHighlightColor('#ffeb3b')" style="background-color: #ffeb3b; border: none; padding: 10px; color: white;">Yellow</button>
                    <button onclick="setHighlightColor('#ff8a80')" style="background-color: #ff8a80; border: none; padding: 10px; color: white;">Red</button>
                    <button onclick="setHighlightColor('#80cbc4')" style="background-color: #80cbc4; border: none; padding: 10px; color: white;">Teal</button>
                    <button onclick="setHighlightColor('#a5d6a7')" style="background-color: #a5d6a7; border: none; padding: 10px; color: white;">Green</button>
                    <button onclick="setHighlightColor('transparent')" style="background-color: white; border: 1px solid #ddd; padding: 10px; color: black;">Clear</button>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 20px;">
                <div style="text-align: center; font-weight: bold;">Sun</div>
                <div style="text-align: center; font-weight: bold;">Mon</div>
                <div style="text-align: center; font-weight: bold;">Tue</div>
                <div style="text-align: center; font-weight: bold;">Wed</div>
                <div style="text-align: center; font-weight: bold;">Thu</div>
                <div style="text-align: center; font-weight: bold;">Fri</div>
                <div style="text-align: center; font-weight: bold;">Sat</div>
                
                <!-- Calendar days with highlightable text areas -->
                <!-- Week 1 -->
                <div style="border: 1px solid #ddd; padding: 10px; min-height: 100px;">
                    1
                    <div contenteditable="true" class="highlight-area" style="width: 100%; min-height: 80px; margin-top: 5px; background-color: white; padding: 5px;" onclick="highlightText(this)">Add notes...</div>
                </div>
                <!-- Add more days as needed -->
            </div>

            <div style="margin-top: 20px; display: flex; justify-content: center; gap: 20px;">
                <div style="display: flex; align-items: center;">
                    <div style="width: 20px; height: 20px; background-color: #90EE90; margin-right: 5px;"></div>
                    <span>Good Day</span>
                </div>
                <div style="display: flex; align-items: center;">
                    <div style="width: 20px; height: 20px; background-color: #FFB6C1; margin-right: 5px;"></div>
                    <span>Challenging Day</span>
                </div>
                <div style="display: flex; align-items: center;">
                    <div style="width: 20px; height: 20px; background-color: #ADD8E6; margin-right: 5px;"></div>
                    <span>Neutral Day</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentColor = 'transparent';

        function setHighlightColor(color) {
            currentColor = color;
        }

        function highlightText(element) {
            element.style.backgroundColor = currentColor;
        }
    </script>

    <div style="display: flex; justify-content: space-between; margin: 20px;">
        <a href="Main Article Page.html" style="background-color: rgb(5, 239, 216); color: rgb(240, 236, 236); padding: 10px 20px; border: none;">Previous Page</a>
    </div>
    <footer style="background-color: #2c3e50; color: white; text-align: center; padding: 20px; margin-top: 50px;">
        <p>&copy; 2023 Understanding PTSD. All rights reserved.</p>
    </footer>
</body>
</html>
